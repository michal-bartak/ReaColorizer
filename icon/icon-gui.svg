<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="AutoColor settings">
  <title>AutoColor settings</title>
  <!--
    The configuration window's icon: the glob star from icon.svg with a gear at its hub. The star
    says which tool this is, the gear says this is the one that opens settings; at a toolbar's 30px
    the two buttons have to be told apart at a glance, which colour alone could not do.

    Three things are deliberate:

      * The gear is CENTRED, not badged into a corner. A corner badge eats one arm, and the mark is
        six equal arms by construction — see icon.svg. Centred, the mask is concentric, so every
        arm shortens by the same 2.0px and the six-fold symmetry survives.
      * #818989 is REAPER's own toolbar grey, measured across the 528 shipped 3-state icons in
        Data/toolbar_icons (52.8% of all opaque pixels in their normal state). It is darker than
        the arms on purpose: the colours carry the identity, the gear only modifies it.
      * Teeth widen toward the root, matching REAPER's own gear iconography. The hole is a real
        hole — a second subpath with fill-rule evenodd — so it shows the toolbar through, rather
        than a disc in some assumed background colour.

    Arms are strokes and the gear is a fill, which is what lets scripts/icon.mjs rotate the arm
    colours for the hover and pressed states while the gear stays put.
  -->
  <mask id="cut">
    <rect width="64" height="64" fill="white"/>
    <circle cx="32" cy="32" r="17.00" fill="black"/>
  </mask>
  <g mask="url(#cut)">
<g stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="32.00" y1="24.00" x2="32.00" y2="7.00"  stroke="#BC3F35"/><!-- Kick    -->
    <line x1="38.93" y1="28.00" x2="54.52" y2="19.00" stroke="#D17A37"/><!-- Snare   -->
    <line x1="38.93" y1="36.00" x2="54.52" y2="45.00" stroke="#D1AC37"/><!-- Hats    -->
    <line x1="32.00" y1="40.00" x2="32.00" y2="57.00" stroke="#39AE80"/><!-- Vocals  -->
    <line x1="25.07" y1="36.00" x2="9.48"  y2="45.00" stroke="#3980AE"/><!-- Guitars -->
    <line x1="25.07" y1="28.00" x2="9.48"  y2="19.00" stroke="#694AAD"/><!-- Bass    -->
  </g>
  </g>
  <path d="M 28.93,21.96 L 29.14,17.28 A 15.00 15.00 0 0 1 34.86,17.28 L 35.07,21.96 A 10.50 10.50 0 0 1 36.93,22.73 L 40.39,19.56 A 15.00 15.00 0 0 1 44.44,23.61 L 41.27,27.07 A 10.50 10.50 0 0 1 42.04,28.93 L 46.72,29.14 A 15.00 15.00 0 0 1 46.72,34.86 L 42.04,35.07 A 10.50 10.50 0 0 1 41.27,36.93 L 44.44,40.39 A 15.00 15.00 0 0 1 40.39,44.44 L 36.93,41.27 A 10.50 10.50 0 0 1 35.07,42.04 L 34.86,46.72 A 15.00 15.00 0 0 1 29.14,46.72 L 28.93,42.04 A 10.50 10.50 0 0 1 27.07,41.27 L 23.61,44.44 A 15.00 15.00 0 0 1 19.56,40.39 L 22.73,36.93 A 10.50 10.50 0 0 1 21.96,35.07 L 17.28,34.86 A 15.00 15.00 0 0 1 17.28,29.14 L 21.96,28.93 A 10.50 10.50 0 0 1 22.73,27.07 L 19.56,23.61 A 15.00 15.00 0 0 1 23.61,19.56 L 27.07,22.73 A 10.50 10.50 0 0 1 28.93,21.96 Z M 26.60,32.00 a 5.40,5.40 0 1,0 10.80,0 a 5.40,5.40 0 1,0 -10.80,0 Z" fill="#818989" fill-rule="evenodd"/>
</svg>
